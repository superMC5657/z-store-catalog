name: Build Catalog

# 每天 00:00 UTC（北京时间 08:00）定时或手动扫描 apps/ 增量编译生成根目录 catalog.json，
# 并编译 showcase.json（同时下架到期 / 已被精选收录的自荐条目）；
# 定时任务成功结束后，会通过 workflow_run 自动串联触发 refresh-catalog.yml 进行每日保鲜。

on:
  schedule:
    # 每天 00:00 UTC（北京时间 08:00）自动编译 catalog.json
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  statuses: write

concurrency:
  group: build-catalog-main
  cancel-in-progress: false

jobs:
  build:
    name: Build catalog.json
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      REPO: ${{ github.repository }}
      GH_TOKEN: ${{ secrets.CATALOG_BOT_TOKEN || github.token }}
      GITHUB_TOKEN: ${{ secrets.CATALOG_BOT_TOKEN || github.token }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.CATALOG_BOT_TOKEN || github.token }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build catalog.json
        run: node scripts/build-catalog.mjs

      - name: Build showcase.json (prune expired / graduated)
        run: node scripts/build-showcase.mjs --prune

      - name: Commit and push catalog.json
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add catalog.json showcase.json showcase/
          if git diff --staged --quiet; then
            echo "catalog.json and showcase.json are already up to date."
            exit 0
          fi
          git commit -m "chore(catalog): automated build of catalog.json [skip ci]"

          # 1. 尝试直接 push 到 main
          if git push origin main 2>/dev/null; then
            echo "Direct push to main succeeded."
            exit 0
          fi

          # 2. 若直接 push 受规则集拦截，通过自动 PR + auto-merge 入库
          echo "Direct push blocked by ruleset, falling back to PR..."
          branch="chore/build-catalog-$(date +%s)"
          git checkout -B "$branch"
          git push --force origin "HEAD:refs/heads/$branch"
          pr_url=$(gh pr create --repo "$REPO" --base main --head "$branch" \
            --title "chore(catalog): automated build of catalog.json [skip ci]" \
            --body "由 build-catalog.yml 自动从 apps/ 编译生成。")
          sha=$(git rev-parse HEAD)
          gh api -X POST "repos/$REPO/statuses/$sha" \
            -f state=success \
            -f context=catalog-ingest \
            -f description="catalog.json validated by build"
          gh pr merge "$pr_url" --repo "$REPO" --squash --delete-branch
