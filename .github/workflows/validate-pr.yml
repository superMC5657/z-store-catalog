name: Validate Catalog PR

on:
  pull_request:
    paths:
      - 'catalog.json'
      - 'scripts/**'
  push:
    branches:
      - main
    paths:
      - 'catalog.json'

jobs:
  validate:
    name: Validate Catalog Schema & Rules
    # bot PR 已由 issue-to-pr / refresh 自己校验；避免合并后补跑产生失败 run。
    if: github.event_name != 'pull_request' || github.event.pull_request.user.login != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate Catalog
        run: node scripts/validate-catalog.mjs

      - name: Test ingest parser
        run: node --test scripts/ingest-issue.test.mjs
