name: Refresh Catalog Baseline

on:
  schedule:
    # 每天 00:00 UTC 自动执行应用库保鲜任务
    - cron: '0 0 * * *'
  workflow_dispatch: # 支持在 GitHub Actions 页面手动点击触发

concurrency:
  group: refresh-catalog
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  refresh-catalog:
    name: Fetch Latest Stars & Releases
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run Catalog Refresher
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/refresh-catalog.mjs

      - name: Commit & Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add catalog.json
          if git diff --staged --quiet; then
            echo "No changes in catalog.json"
            exit 0
          fi
          git commit -m "chore(catalog): automated refresh of stars, forks, and releases [skip ci]"
          # 与收录 PR 共用 catalog.json：push 前先 rebase，冲突时退避重试。
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push; then
              exit 0
            fi
            git rebase --abort || true
            sleep $((attempt * 5))
          done
          echo "::error::catalog.json push failed after 3 attempts"
          exit 1
